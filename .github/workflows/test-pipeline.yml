name: RemoteFlow Test Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  # Global safeguards for DB and Flyway
  DB_USERNAME: root
  DB_PASSWORD: mariadb

jobs:
  unit-tests:
    name: Fast Logic (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run Unit tests
        run: ./mvnw -B -q -Ptest-unit test
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
      - name: Upload JaCoCo Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit
          path: target/jacoco.exec

  security-tests:
    name: Medium (Security)
    runs-on: ubuntu-latest
    # Removed needs: unit-tests to run in parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run Security tests
        run: ./mvnw -B -q -Ptest-security test
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
      - name: Upload JaCoCo Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-security
          path: target/jacoco.exec

  frontend-tests:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chohdi-alt/remoteflew-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Static Analysis (Lint)
        working-directory: frontend
        run: npm run lint
      - name: Unit Tests (Isolated)
        working-directory: frontend
        run: npm run test:coverage -- --browsers=ChromeHeadlessCI
      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  integration-tests:
    name: Heavy (Integration + Workflow)
    runs-on: ubuntu-latest
    needs: [ unit-tests, security-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run Integration tests
        run: ./mvnw -B -q -Ptest-integration test
      - name: Run Workflow tests
        run: ./mvnw -B -q -Ptest-workflow test
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
      - name: Upload JaCoCo Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-integration-workflow
          path: target/jacoco.exec

  e2e:
    name: Self-Contained E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [ integration-tests, frontend-tests ]
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: pfeworkflow
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -u root -pmariadb"
          --health-interval=10s --health-timeout=5s --health-retries=10
          --health-start-period=20s

    steps:

      - name: Checkout Backend
        uses: actions/checkout@v4
      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: chohdi-alt/remoteflew-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend-src
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Fix mvnw permission
        run: chmod +x mvnw

      - name: Build Backend
        run: ./mvnw clean install -DskipTests

      - name: Start Backend in Background
        run: |
          java -jar target/RemoteFlowApplication-0.0.1-SNAPSHOT.jar \
            --server.port=8080 \
            --spring.profiles.active=test \
            > backend.log 2>&1 &

            
          echo "Waiting for backend..."
          timeout 160s bash -c '
          until curl -s http://localhost:8080/actuator/health | grep UP; do
            sleep 3
          done
          ' || (echo "Backend failed:" && cat backend.log && exit 1)
        env:
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3307/pfeworkflow
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: mariadb
          REMOTETEL_WEBSOCKET_ENABLED: "false" # Disable relay dependencies for E2E

      - name: Download Frontend dist
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Serve Frontend
        run: |
          npx http-server frontend-dist/remote-flow-app/browser -p 4200 -s &
          echo "Waiting for frontend to be ready..."
          timeout 30s bash -c 'until curl -s http://localhost:4200 | grep "<html"; do sleep 1; done'

      - name: Install Playwright
        working-directory: tests/e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E Tests
        working-directory: tests/e2e/playwright
        run: npm test
        env:
          BACKEND_BASE_URL: http://localhost:8080
          FRONTEND_URL: http://localhost:4200
          SPRING_PROFILES_ACTIVE: test
          # Pointing playwright to the local frontend instance if config allows
          # Process.env.FRONTEND_URL: http://localhost:4200

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/playwright/playwright-report/

  coverage-report:
    name: Coverage Aggregation
    runs-on: ubuntu-latest
    needs: [ unit-tests, security-tests, integration-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Download all JaCoCo data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          merge-multiple: true
          path: target/
      - name: Generate Aggregate Report
        run: ./mvnw jacoco:report
      - name: Upload Full Coverage
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-report
          path: target/site/jacoco/

  performance:
    name: Performance SLA (manual/scheduled)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run JMeter
        run: |
          mkdir -p results
          docker run --rm -v ${PWD}:/opt/jmeter -w /opt/jmeter \
            justb4/jmeter -n \
            -JBASE_HOST="${{ secrets.PERF_BASE_HOST }}" \
            -JBASE_PORT="${{ secrets.PERF_BASE_PORT }}" \
            -JEMPLOYEE_TOKEN="${{ secrets.PERF_EMPLOYEE_TOKEN }}" \
            -JMANAGER_TOKEN="${{ secrets.PERF_MANAGER_TOKEN }}" \
            -t tests/performance/jmeter/telework-load-test.jmx \
            -l results/results.jtl
      - name: Validate SLA (Fail if error rate > 0%)
        run: |
          error_count=$(awk -F',' 'NR>1 {if ($8 == "false") count++} END {print count+0}' results/results.jtl)
          if [ "$error_count" -gt 0 ]; then
            echo "::error::Performance SLA Violated: $error_count errors detected."
            exit 1
          fi
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/
