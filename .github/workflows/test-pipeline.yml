name: RemoteFlow Test Pipeline

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  # Global safeguards for DB and Flyway
  DB_USERNAME: root
  DB_PASSWORD: mariadb

jobs:
  unit-tests:
    name: Fast Logic (Unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run Unit tests
        run: ./mvnw -B -q -Ptest-unit test
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
      - name: Upload JaCoCo Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-unit
          path: target/jacoco.exec

  security-tests:
    name: Medium (Security)
    runs-on: ubuntu-latest
    # Removed needs: unit-tests to run in parallel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run Security tests
        run: ./mvnw -B -q -Ptest-security test
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
      - name: Upload JaCoCo Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-security
          path: target/jacoco.exec

  frontend-tests:
    name: Frontend (Angular)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: chohdi-alt/remoteflew-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Static Analysis (Lint)
        working-directory: frontend
        run: npm run lint
      - name: Unit Tests (Isolated)
        working-directory: frontend
        run: npm run test:coverage -- --browsers=ChromeHeadlessCI
      - name: Build Production Bundle
        working-directory: frontend
        run: npm run build
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

  integration-tests:
    name: Heavy (Integration + Workflow)
    runs-on: ubuntu-latest
    needs: [ unit-tests, security-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run Integration tests
        run: ./mvnw -B -q -Ptest-integration test
      - name: Run Workflow tests
        run: ./mvnw -B -q -Ptest-workflow test
      - name: Publish Test Report
        uses: scacap/action-surefire-report@v1
        if: always()
      - name: Upload JaCoCo Data
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-integration-workflow
          path: target/jacoco.exec

  backend-tests:
    runs-on: ubuntu-latest

    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mariadb
          MARIADB_DATABASE: pfeworkflow
        ports:
          - 3307:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=10s
          --health-timeout=5s --health-retries=3

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Run tests
        run: ./mvnw clean verify
        env:
          SPRING_PROFILES_ACTIVE: test
          SPRING_DATASOURCE_URL: jdbc:mariadb://localhost:3307/pfeworkflow
          SPRING_DATASOURCE_USERNAME: root
          SPRING_DATASOURCE_PASSWORD: mariadb

          # 🔴 hard-disable external systems (CI-safe)
          ZEEBE_CLIENT_ENABLED: false
          CAMUNDA_CLIENT_ENABLED: false
          KEYCLOAK_ENABLED: false
          ALFRESCO_ENABLED: false

  sonar:
    name: SonarCloud Analysis
    runs-on: ubuntu-latest
    needs: [ backend-tests, frontend-tests ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw

      - name: Sonar Scan (Backend)
        run: |
          ./mvnw sonar:sonar \
            -Dsonar.projectKey=chohdi-alt_RemoteFlew \
            -Dsonar.organization=chohdi-alt \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: chohdi-alt/remoteflew-frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}
          path: frontend

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend deps
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Coverage
        working-directory: frontend
        run: npm run test:coverage -- --browsers=ChromeHeadlessCI

      - name: Sonar Scan (Frontend)
        working-directory: frontend
        run: npx sonar-scanner \ -Dsonar.login=${{ secrets.SONAR_TOKEN }}

  coverage-report:
    name: Coverage Aggregation
    runs-on: ubuntu-latest
    needs: [ unit-tests, security-tests, integration-tests ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Fix mvnw permission
        run: chmod +x mvnw
      - name: Download all JaCoCo data
        uses: actions/download-artifact@v4
        with:
          pattern: jacoco-*
          merge-multiple: true
          path: target/
      - name: Generate Aggregate Report
        run: ./mvnw jacoco:report
      - name: Upload Full Coverage
        uses: actions/upload-artifact@v4
        with:
          name: full-coverage-report
          path: target/site/jacoco/

  performance:
    name: Performance SLA (manual/scheduled)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - name: Run JMeter
        run: |
          mkdir -p results
          docker run --rm -v ${PWD}:/opt/jmeter -w /opt/jmeter \
            justb4/jmeter -n \
            -JBASE_HOST="${{ secrets.PERF_BASE_HOST }}" \
            -JBASE_PORT="${{ secrets.PERF_BASE_PORT }}" \
            -JEMPLOYEE_TOKEN="${{ secrets.PERF_EMPLOYEE_TOKEN }}" \
            -JMANAGER_TOKEN="${{ secrets.PERF_MANAGER_TOKEN }}" \
            -t tests/performance/jmeter/telework-load-test.jmx \
            -l results/results.jtl
      - name: Validate SLA (Fail if error rate > 0%)
        run: |
          error_count=$(awk -F',' 'NR>1 {if ($8 == "false") count++} END {print count+0}' results/results.jtl)
          if [ "$error_count" -gt 0 ]; then
            echo "::error::Performance SLA Violated: $error_count errors detected."
            exit 1
          fi
      - name: Upload Results
        uses: actions/upload-artifact@v4
        with:
          name: jmeter-results
          path: results/
