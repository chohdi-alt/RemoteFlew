name: E2E Full System

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: chohdi-alt/remoteflew-frontend
          path: RemoteFlowApp
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      # 🔥 Build Docker images via Compose (ensures correct context and tags)
      - name: Build images
        run: docker compose -f Docker/docker-compose.e2e.yml build

      # 🔥 Start full stack
      - name: Start stack
        run: docker compose -f Docker/docker-compose.e2e.yml up -d

      # 🔥 Wait for MariaDB
      - name: Wait DB
        run: |
          for i in {1..20}; do
            nc -z localhost 3310 && break
            sleep 3
          done

      # 🔥 Wait Keycloak
      - name: Wait Keycloak
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8081 && break
            sleep 5
          done

      # 🔥 Wait backend
      - name: Wait Backend
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8088/actuator/health && break
            sleep 5
          done

      # 🔥 Wait frontend
      - name: Wait Frontend
        run: |
          for i in {1..20}; do
            curl -f http://localhost:4200 && break
            sleep 3
          done

      # 🔥 Run E2E tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E2E
        run: |
          cd RemoteFlowApp
          npm ci
          npm run e2e

      # 🔥 Cleanup
      - name: Shutdown
        if: always()
        run: docker compose -f Docker/docker-compose.e2e.yml down
