name: E2E Full System

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Checkout Frontend
        uses: actions/checkout@v4
        with:
          repository: chohdi-alt/remoteflew-frontend
          path: RemoteFlowApp
          token: ${{ secrets.FRONTEND_REPO_TOKEN }}

      # 🔥 Build Docker images via Compose (ensures correct context and tags)
      - name: Build images
        run: docker compose -f Docker/docker-compose.e2e.yml build

      # 🔥 Start full stack
      - name: Start stack
        run: docker compose -f Docker/docker-compose.e2e.yml up -d

      # 🔥 Immediate diagnostic (catches instant crashes)
      - name: Docker Status Check
        run: |
          docker ps -a
          docker logs e2e-backend --tail 50

      # 🔥 Wait backend (Only required check, others handled by depends_on health)
      - name: Wait Backend
        run: |
          for i in {1..60}; do
            echo "Waiting for backend... attempt $i"

            if curl -s http://localhost:8088/actuator/health/liveness | grep -q '"status":"UP"'; then
              echo "Backend is UP"
              exit 0
            fi

            sleep 5
          done

          echo "Backend did not become ready in time"
          exit 1

      # 🔥 Run E2E tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E2E
        run: |
          cd RemoteFlowApp
          npm ci
          npm run e2e

      # 🔥 DEBUG LOGS ON FAILURE
      - name: Debug Failure Logs
        if: failure()
        run: |
          echo "========================================================="
          echo "🚨 E2E FAILURE DETECTED — CAPTURING DIAGNOSTICS 🚨"
          echo "========================================================="
          docker ps -a
          echo "--- INSPECT BACKEND ---"
          docker inspect e2e-backend
          echo "--- BACKEND LOGS ---"
          docker logs e2e-backend
          echo "--- KEYCLOAK LOGS ---"
          docker logs e2e-keycloak --tail 100
          echo "--- MARIADB LOGS ---"
          docker logs e2e-mariadb --tail 50
          echo "--- ACTIVEMQ LOGS ---"
          docker logs e2e-activemq --tail 50
          echo "--- FRONTEND LOGS ---"
          docker logs e2e-frontend --tail 50

      # 🔥 Cleanup
      - name: Shutdown
        if: always()
        run: docker compose -f Docker/docker-compose.e2e.yml down
