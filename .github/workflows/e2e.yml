name: E2E Full System

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # 🔥 Build Docker images (CRITICAL — your audit flagged this missing)
      - name: Build backend image
        run: docker build -t backend-test ./backend

      - name: Build frontend image
        run: docker build -t frontend-test ./frontend

      # 🔥 Start full stack
      - name: Start stack
        run: docker compose -f docker-compose.e2e.yml up -d

      # 🔥 Wait for MariaDB
      - name: Wait DB
        run: |
          for i in {1..20}; do
            nc -z localhost 3307 && break
            sleep 3
          done

      # 🔥 Wait Keycloak
      - name: Wait Keycloak
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8081 && break
            sleep 5
          done

      # 🔥 Wait backend
      - name: Wait Backend
        run: |
          for i in {1..30}; do
            curl -f http://localhost:8088/actuator/health && break
            sleep 5
          done

      # 🔥 Wait frontend
      - name: Wait Frontend
        run: |
          for i in {1..20}; do
            curl -f http://localhost:4200 && break
            sleep 3
          done

      # 🔥 Run E2E tests
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run E2E
        run: |
          cd frontend
          npm ci
          npm run e2e

      - name: Dump container logs on failure
        if: failure()
        run: |
          echo "========== DOCKER STATUS =========="
          docker ps -a

          echo "========== BACKEND LOGS =========="
          docker logs e2e-backend || true

          echo "========== KEYCLOAK LOGS =========="
          docker logs e2e-keycloak || true

          echo "========== MARIADB LOGS =========="
          docker logs e2e-mariadb || true

          echo "========== ACTIVEMQ LOGS =========="
          docker logs e2e-activemq || true

          echo "========== FRONTEND LOGS =========="
          docker logs e2e-frontend || true

      # 🔥 Cleanup
      - name: Shutdown
        if: always()
        run: docker compose -f docker-compose.e2e.yml down
