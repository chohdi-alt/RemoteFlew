version: '3.8'

networks:
  camunda-platform:

volumes:
  zeebe-data:
  elastic-data:

services:

  zeebe:
    image: camunda/zeebe:8.5.3
    container_name: zeebe
    ports:
      - "26500:26500"
      - "9600:9600"
    environment:
      # --- Gateway (MANDATORY) ---
      - ZEEBE_BROKER_GATEWAY_ENABLE=true
      - ZEEBE_BROKER_GATEWAY_NETWORK_HOST=0.0.0.0
      - ZEEBE_BROKER_GATEWAY_NETWORK_PORT=26500

      # --- Plaintext ---
      - ZEEBE_INSECURE_CONNECTION=true

      # --- Elasticsearch exporter ---
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1

    depends_on:
      - elasticsearch
    networks:
      - camunda-platform
    volumes:
      - zeebe-data:/usr/local/zeebe/data

  operate:
    image: camunda/operate:8.5.3
    container_name: operate
    ports:
      - "8085:8080"
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_OPERATE_USERNAME=demo
      - CAMUNDA_OPERATE_PASSWORD=demo
    depends_on:
      - zeebe
      - elasticsearch
    networks:
      - camunda-platform

  tasklist:
    image: camunda/tasklist:8.5.3
    container_name: tasklist
    ports:
      - "8086:8080"
    environment:
      - CAMUNDA_TASKLIST_ZEEBE_GATEWAYADDRESS=zeebe:26500
      - CAMUNDA_TASKLIST_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_ZEEBE_ELASTICSEARCH_URL=http://elasticsearch:9200
      - CAMUNDA_TASKLIST_USERNAME=demo
      - CAMUNDA_TASKLIST_PASSWORD=demo
    depends_on:
      - zeebe
      - elasticsearch
    networks:
      - camunda-platform

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: elasticsearch
    ports:
      - "9200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    networks:
      - camunda-platform
    volumes:
      - elastic-data:/usr/share/elasticsearch/data
