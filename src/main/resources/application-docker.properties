# ================= DATABASE (DOCKER) =================
spring.datasource.url=jdbc:mariadb://mariadb-test:3306/pfeworkflow
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:mariadb}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# ALFRESCO
# ===============================
alfresco.base-url=http://alfresco:8080/alfresco

# =========================
# KEYCLOAK / OAUTH2 (DOCKER)
# =========================

# Resource Server (JWT validation)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8080/realms/pfe-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8080/realms/pfe-realm/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.clock-skew=180s

logging.level.org.springframework.security=INFO

# Keycloak base config
keycloak.auth-server-url=http://keycloak:8080
keycloak.realm=pfe-realm

# Client (used for login/token)
keycloak.client-id=PfeClient
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:cC9ZnTaGLwG6OCs5xKnRaxQNFzyYCEwT}

# =========================
# ADMIN CLIENT (THIS IS YOUR ISSUE)
# =========================

keycloak.admin.server-url=http://keycloak:8080
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=${KEYCLOAK_ADMIN_PASSWORD:admin}
# ===============================
# ZEEBE (MATCH LOCAL CONFIG)
# ===============================

camunda.client.mode=simple

camunda.client.grpc-address=http://zeebe:26500
camunda.client.rest-address=http://zeebe:8080
camunda.client.security.plaintext=true

camunda.client.zeebe.defaults.name=remote-flow-worker

camunda.client.operate.enabled=false
camunda.client.optimize.enabled=false
camunda.client.identity.enabled=false

# ===============================
# ELASTICSEARCH
# ===============================
spring.elasticsearch.uris=http://elasticsearch:9200

# ===============================
# WEBSOCKET (ActiveMQ unified)
# ===============================
remoteflow.websocket.relay-host=activemq
remoteflow.websocket.relay-port=61613