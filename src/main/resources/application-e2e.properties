# ===========================================
# E2E PROFILE — used exclusively by docker-compose.e2e.yml
# Activated via: SPRING_PROFILES_ACTIVE=e2e
# ===========================================
spring.main.lazy-initialization=true

# -----------------------------------------------
# DATABASE — overridden at runtime by compose env
# -----------------------------------------------
spring.datasource.url=jdbc:mariadb://e2e-mariadb:3306/pfeworkflow
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=mariadb

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true

# -----------------------------------------------
# KEYCLOAK — real instance, container names
# -----------------------------------------------
# NOTE: jwk-set-uri ONLY (no issuer-uri).
# issuer-uri triggers an eager OIDC discovery fetch at Spring context
# initialization — before ApplicationRunner beans and before depends_on
# health checks can guarantee Keycloak readiness.
# jwk-set-uri is fetched lazily on first JWT validation → safe.
spring.security.oauth2.resourceserver.jwt.issuer-uri=
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://e2e-keycloak:8080/realms/pfe-realm/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.clock-skew=180s

keycloak.bootstrap.enabled=false

keycloak.enabled=true
keycloak.auth-server-url=http://e2e-keycloak:8080
keycloak.realm=pfe-realm
keycloak.client-id=PfeClient
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:cC9ZnTaGLwG6OCs5xKnRaxQNFzyYCEwT}

keycloak.admin.server-url=http://e2e-keycloak:8080
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin

# -----------------------------------------------
# CAMUNDA / ZEEBE — disabled for Phase-1 E2E
# -----------------------------------------------
camunda.enabled=false
camunda.client.enabled=false
camunda.client.mode=simple
camunda.client.grpc-address=http://mock-zeebe:26500
camunda.client.rest-address=http://mock-zeebe:8080
camunda.client.security.plaintext=true
camunda.client.zeebe.defaults.name=remote-flow-worker
camunda.client.zeebe.enabled=false
camunda.client.operate.enabled=false
camunda.client.optimize.enabled=false
camunda.client.identity.enabled=false

# -----------------------------------------------
# ALFRESCO — disabled for Phase-1 E2E
# -----------------------------------------------
alfresco.enabled=false
alfresco.base-url=http://mock-alfresco:8080/alfresco

# -----------------------------------------------
# ELASTICSEARCH — disabled for E2E
# -----------------------------------------------
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.elasticsearch.ElasticsearchClientAutoConfiguration,\
  org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration
spring.elasticsearch.uris=http://mock-elastic:9200

# -----------------------------------------------
# WEBSOCKET (ActiveMQ STOMP relay)
# -----------------------------------------------
remoteflow.websocket.enabled=false
remoteflow.websocket.relay-host=e2e-activemq
remoteflow.websocket.relay-port=61613

# -----------------------------------------------
# ACTUATOR
# -----------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true

# -----------------------------------------------
# SECURITY TUNING
# -----------------------------------------------
security.login-protection.bootstrap-keycloak-brute-force=true
security.login-protection.keycloak.enabled=true
security.login-protection.keycloak.max-login-failures=5
security.login-protection.keycloak.wait-increment-seconds=60
security.login-protection.keycloak.quick-login-check-millis=1000
security.login-protection.keycloak.minimum-quick-login-wait-seconds=60
security.login-protection.keycloak.max-wait-seconds=300
security.login-protection.keycloak.failure-reset-seconds=900
security.login-protection.keycloak.permanent-lockout=false
security.login-protection.hard-lock-enabled=true
security.login-protection.hard-lock-threshold-failures=10
security.login-protection.hard-lock-threshold-lock-events=2
security.login-protection.failure-window-minutes=30
security.login-protection.temporary-lock-dedup-seconds=300

telework.max-days-per-week=1
app.activation-link-base=http://localhost:4200/activate
security.activation-token.ttl-minutes=1440

# -----------------------------------------------
# LOGGING
# -----------------------------------------------
logging.level.tn.pi.remoteflowapplication=INFO
logging.level.org.springframework.security=INFO
logging.level.io.camunda.zeebe.spring=WARN
logging.level.io.camunda.zeebe.client=WARN
