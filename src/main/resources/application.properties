alfresco.rejected-folder-id=workspace://SpacesStore/52439cd8-2b28-425c-bb6d-30cf1ebd8656
alfresco.archive-folder-id=workspace://SpacesStore/c63c909d-65dd-4b50-8d40-c27a68a574e8

# =========================
# KEYCLOAK / OAUTH2
# =========================

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081/realms/pfe-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/realms/pfe-realm/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.clock-skew=180s
logging.level.org.springframework.security=INFO
keycloak.auth-server-url=http://localhost:8081
keycloak.realm=pfe-realm
keycloak.client-id=PfeClient
keycloak.client-secret=${KEYCLOAK_SECRET:cC9ZnTaGLwG6OCs5xKnRaxQNFzyYCEwT}
keycloak.admin.server-url=http://localhost:8081
keycloak.admin.realm=master
keycloak.admin.client-id=admin-cli
keycloak.admin.username=admin
keycloak.admin.password=admin


spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false
telework.max-days-per-week=1

# ===============================
# Camunda 8 / Zeebe configuration
# ===============================

# Self-managed, no Identity/OIDC
camunda.client.mode=simple

# Correct connection properties (camunda.client.grpc-address, NOT camunda.client.zeebe.*)
camunda.client.grpc-address=http://localhost:26500
camunda.client.security.plaintext=true
# Ensure Zeebe worker defaults are initialized (prevents NPE in worker customizer)
camunda.client.zeebe.defaults.name=remote-flow-worker

# Disable web clients (no client JARs in pom.xml; BPMN deployment handled by @Deployment)
camunda.client.operate.enabled=false
camunda.client.optimize.enabled=false
camunda.client.identity.enabled=false

# Debug logging to observe BPMN deployment at startup
logging.level.io.camunda.zeebe.spring=DEBUG
logging.level.io.camunda.zeebe.client=DEBUG

# ===============================
# Account activation
# ===============================
app.activation-link-base=http://localhost:4200/activate
security.activation-token.ttl-minutes=1440


# ===============================
# WebSocket (STOMP)
# ===============================
remoteflow.websocket.enabled=true

# STOMP Broker Relay (RabbitMQ/ActiveMQ - required when enabled=true)
# Override in production via environment variables
remoteflow.websocket.relay-host=${WS_RELAY_HOST:localhost}
remoteflow.websocket.relay-port=${WS_RELAY_PORT:61613}
remoteflow.websocket.relay-client-login=${WS_RELAY_CLIENT_LOGIN:admin}
remoteflow.websocket.relay-client-passcode=${WS_RELAY_CLIENT_PASSCODE:admin}
remoteflow.websocket.relay-system-login=${WS_RELAY_SYSTEM_LOGIN:admin}
remoteflow.websocket.relay-system-passcode=${WS_RELAY_SYSTEM_PASSCODE:admin}

# ===============================
# Actuator / Observability
# ===============================
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
