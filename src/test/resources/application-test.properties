# ==========================================
# TEST PROFILE OVERRIDES
# ==========================================

# Mock Security to Avoid Real Keycloak in CI
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://dummy/realms/mock
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://dummy/jwks
keycloak.enabled=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Persistence (Handled by Testcontainers, but Flyway should be enabled for schema)
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=none

# Disable performance-heavy features
logging.level.tn.pi.remoteflowapplication=INFO
spring.jpa.show-sql=false
remoteflow.websocket.enabled=false
