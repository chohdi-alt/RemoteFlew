spring:
  autoconfigure:
    exclude:
      - io.camunda.zeebe.spring.client.configuration.ZeebeClientAllAutoConfiguration
      - io.camunda.zeebe.spring.client.configuration.ZeebeActuatorConfiguration

  datasource:
    url: jdbc:mariadb://localhost:3307/pfeworkflow
    username: root
    password: mariadb

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

# Disable external systems (logical flags)
keycloak:
  enabled: false

alfresco:
  enabled: false

telework:
  max-days-per-week: 1