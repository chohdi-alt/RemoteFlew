spring:
  datasource:
    url: jdbc:mariadb://localhost:3307/pfeworkflow
    username: root
    password: mariadb
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

  main:
    allow-bean-definition-overriding: true

# ✅ Actuator (FIXES your CI health check)
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    org.springframework.core.env: DEBUG
# Business rules
telework:
  max-days-per-week: 1
