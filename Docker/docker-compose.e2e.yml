# ================================================================
# docker-compose.e2e.yml — CI-safe version (no curl dependencies)
# ================================================================

services:

  # ──────────────────────────────────────────────────────────────
  # 1. DATABASE
  # ──────────────────────────────────────────────────────────────
  e2e-mariadb:
    image: mariadb:11.4
    container_name: e2e-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
      MARIADB_DATABASE: pfeworkflow
    ports:
      - "3310:3306"
    volumes:
      - e2e-mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "localhost", "-u", "root", "-pmariadb"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 2. KEYCLOAK
  # ──────────────────────────────────────────────────────────────
  e2e-keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: e2e-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: WARN
    volumes:
      - ../keycloak/pfe-realm-export.json:/opt/keycloak/data/import/pfe-realm-export.json:ro
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 3. ACTIVEMQ
  # ──────────────────────────────────────────────────────────────
  e2e-activemq:
    image: apache/activemq-classic:5.18.3
    container_name: e2e-activemq
    ports:
      - "61616:61616"
      - "61613:61613"
      - "8161:8161"
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/61616 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 4. BACKEND
  # ──────────────────────────────────────────────────────────────
  e2e-backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: remoteflow-backend:e2e
    container_name: e2e-backend
    environment:
      SPRING_PROFILES_ACTIVE: e2e

      SPRING_DATASOURCE_URL: jdbc:mariadb://e2e-mariadb:3306/pfeworkflow
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mariadb

      KEYCLOAK_AUTH_SERVER_URL: http://e2e-keycloak:8080
      KEYCLOAK_ADMIN_SERVER_URL: http://e2e-keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-cC9ZnTaGLwG6OCs5xKnRaxQNFzyYCEwT}
      KEYCLOAK_ADMIN_PASSWORD: admin

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-keycloak:8080/realms/pfe-realm/protocol/openid-connect/certs

      REMOTEFLOW_WEBSOCKET_RELAY_HOST: e2e-activemq
      REMOTEFLOW_WEBSOCKET_RELAY_PORT: "61613"

    ports:
      - "8088:8088"
    depends_on:
      e2e-mariadb:
        condition: service_healthy
      e2e-keycloak:
        condition: service_healthy
      e2e-activemq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8088 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 5. FRONTEND
  # ──────────────────────────────────────────────────────────────
  e2e-frontend:
    build:
      context: ../RemoteFlowApp
      dockerfile: dockerfile
    image: remoteflow-frontend:e2e
    container_name: e2e-frontend
    ports:
      - "4200:80"
    depends_on:
      e2e-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - e2e-net

# ──────────────────────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────────────────────
networks:
  e2e-net:
    driver: bridge
    name: remoteflow-e2e-net

# ──────────────────────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────────────────────
volumes:
  e2e-mariadb-data:
    driver: local