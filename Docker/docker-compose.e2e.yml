# ================================================================
# docker-compose.e2e.yml — CI-safe version (no curl dependencies)
# ================================================================

services:

  # ──────────────────────────────────────────────────────────────
  # 1. DATABASE
  # ──────────────────────────────────────────────────────────────
  e2e-mariadb:
    image: mariadb:11.4
    container_name: e2e-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: mariadb
      MARIADB_DATABASE: pfeworkflow
    ports:
      - "3310:3306"
    volumes:
      - e2e-mariadb-data:/var/lib/mysql
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 2. KEYCLOAK
  # ──────────────────────────────────────────────────────────────
  e2e-keycloak:
    image: quay.io/keycloak/keycloak:24.0.3
    container_name: e2e-keycloak
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_LOG_LEVEL: WARN
    volumes:
      - ../keycloak/pfe-realm-export.json:/opt/keycloak/data/import/pfe-realm-export.json:ro
    ports:
      - "8081:8080"
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 3. ACTIVEMQ
  # ──────────────────────────────────────────────────────────────
  e2e-activemq:
    image: apache/activemq-classic:5.18.3
    container_name: e2e-activemq
    ports:
      - "61616:61616"
      - "61613:61613"
      - "8161:8161"
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 4. ELASTICSEARCH
  # ──────────────────────────────────────────────────────────────
  e2e-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:7.17.22
    container_name: e2e-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 5. ZEEBE
  # ──────────────────────────────────────────────────────────────
  e2e-zeebe:
    image: camunda/zeebe:8.5.3
    container_name: e2e-zeebe
    environment:
      - ZEEBE_BROKER_GATEWAY_ENABLE=true
      - ZEEBE_BROKER_GATEWAY_NETWORK_HOST=0.0.0.0
      - ZEEBE_BROKER_GATEWAY_NETWORK_PORT=26500
      - ZEEBE_INSECURE_CONNECTION=true
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_CLASSNAME=io.camunda.zeebe.exporter.ElasticsearchExporter
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_URL=http://e2e-elasticsearch:9200
      - ZEEBE_BROKER_EXPORTERS_ELASTICSEARCH_ARGS_BULK_SIZE=1
    depends_on:
      e2e-elasticsearch:
        condition: service_healthy
    ports:
      - "26500:26500"
      - "9600:9600"
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 6. OPERATE
  # ──────────────────────────────────────────────────────────────
  e2e-operate:
    image: camunda/operate:8.5.3
    container_name: e2e-operate
    environment:
      - CAMUNDA_OPERATE_ZEEBE_GATEWAYADDRESS=e2e-zeebe:26500
      - CAMUNDA_OPERATE_ELASTICSEARCH_URL=http://e2e-elasticsearch:9200
      - CAMUNDA_OPERATE_ZEEBE_ELASTICSEARCH_URL=http://e2e-elasticsearch:9200
      - CAMUNDA_OPERATE_USERNAME=demo
      - CAMUNDA_OPERATE_PASSWORD=demo
    depends_on:
      - e2e-zeebe
    ports:
      - "8085:8080"
    networks:
      - e2e-net

  # ──────────────────────────────────────────────────────────────
  # 7. BACKEND
  # ──────────────────────────────────────────────────────────────
  e2e-backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    image: remoteflow-backend:e2e
    container_name: e2e-backend
    environment:
      SPRING_PROFILES_ACTIVE: e2e

      SPRING_DATASOURCE_URL: jdbc:mariadb://e2e-mariadb:3306/pfeworkflow
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: mariadb

      KEYCLOAK_AUTH_SERVER_URL: http://e2e-keycloak:8080
      KEYCLOAK_ADMIN_SERVER_URL: http://e2e-keycloak:8080
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:-cC9ZnTaGLwG6OCs5xKnRaxQNFzyYCEwT}
      KEYCLOAK_ADMIN_PASSWORD: admin

      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI: http://e2e-keycloak:8080/realms/pfe-realm/protocol/openid-connect/certs

      REMOTEFLOW_WEBSOCKET_RELAY_HOST: e2e-activemq
      REMOTEFLOW_WEBSOCKET_RELAY_PORT: "61613"

      ZEEBE_CLIENT_BROKER_GATEWAY_ADDRESS: e2e-zeebe:26500
      ZEEBE_CLIENT_SECURITY_PLAINTEXT: "true"

    ports:
      - "8088:8088"
    depends_on:
      e2e-mariadb:
        condition: service_started
      e2e-keycloak:
        condition: service_started
      e2e-activemq:
        condition: service_started
    networks:
      - e2e-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ──────────────────────────────────────────────────────────────
  # 8. FRONTEND
  # ──────────────────────────────────────────────────────────────
  e2e-frontend:
    build:
      context: ../../RemoteFlowApp
      dockerfile: dockerfile
    image: remoteflow-frontend:e2e
    container_name: e2e-frontend
    ports:
      - "4200:80"
    depends_on:
      e2e-backend:
        condition: service_started
    networks:
      - e2e-net

# ──────────────────────────────────────────────────────────────
# NETWORKS
# ──────────────────────────────────────────────────────────────
networks:
  e2e-net:
    driver: bridge
    name: remoteflow-e2e-net

# ──────────────────────────────────────────────────────────────
# VOLUMES
# ──────────────────────────────────────────────────────────────
volumes:
  e2e-mariadb-data:
    driver: local